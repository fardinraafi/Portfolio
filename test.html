<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page - Flowy Background</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Load Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        /* Base site styles to mimic your website */
        :root {
            --c1: #2563EB; --c2: #7C3AED;
            --bg-page: #0F172A;
            --text-main: #F1F5F9;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* The Container for the WebGL Background */
        #floating-lines-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
            /* Screen blend mode ensures the black background of the shader becomes transparent, leaving only the glowing lines! */
            mix-blend-mode: screen; 
        }

        /* Just some test content to see how it looks behind your UI */
        .test-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            pointer-events: none;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            pointer-events: auto; /* Let the card be interactive */
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 3.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--c1), var(--c2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p { color: #94A3B8; font-size: 1.1rem; max-width: 400px; margin: 0 auto; }
    </style>
</head>
<body>

    <!-- This div holds the Three.js Canvas -->
    <div id="floating-lines-container"></div>

    <!-- Temporary UI to test layering -->
    <div class="test-content">
        <div class="glass-card">
            <h1>Interactive Flow</h1>
            <p>Move your mouse around the screen to see the lines bend and react to your cursor in real-time.</p>
        </div>
    </div>

    <script>
        // ==========================================
        // SHADER DEFINITIONS
        // ==========================================
        const vertexShader = `
        precision highp float;
        void main() {
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
        `;

        const fragmentShader = `
        precision highp float;

        uniform float iTime;
        uniform vec3  iResolution;
        uniform float animationSpeed;

        uniform bool enableTop;
        uniform bool enableMiddle;
        uniform bool enableBottom;

        uniform int topLineCount;
        uniform int middleLineCount;
        uniform int bottomLineCount;

        uniform float topLineDistance;
        uniform float middleLineDistance;
        uniform float bottomLineDistance;

        uniform vec3 topWavePosition;
        uniform vec3 middleWavePosition;
        uniform vec3 bottomWavePosition;

        uniform vec2 iMouse;
        uniform bool interactive;
        uniform float bendRadius;
        uniform float bendStrength;
        uniform float bendInfluence;

        uniform bool parallax;
        uniform float parallaxStrength;
        uniform vec2 parallaxOffset;

        uniform vec3 lineGradient[8];
        uniform int lineGradientCount;

        const vec3 BLACK = vec3(0.0);
        const vec3 PINK  = vec3(233.0, 71.0, 245.0) / 255.0;
        const vec3 BLUE  = vec3(47.0,  75.0, 162.0) / 255.0;

        mat2 rotate(float r) {
            return mat2(cos(r), sin(r), -sin(r), cos(r));
        }

        vec3 background_color(vec2 uv) {
            vec3 col = vec3(0.0);
            float y = sin(uv.x - 0.2) * 0.3 - 0.1;
            float m = uv.y - y;
            col += mix(BLUE, BLACK, smoothstep(0.0, 1.0, abs(m)));
            col += mix(PINK, BLACK, smoothstep(0.0, 1.0, abs(m - 0.8)));
            return col * 0.5;
        }

        vec3 getLineColor(float t, vec3 baseColor) {
            if (lineGradientCount <= 0) { return baseColor; }
            vec3 gradientColor;
            if (lineGradientCount == 1) {
                gradientColor = lineGradient[0];
            } else {
                float clampedT = clamp(t, 0.0, 0.9999);
                float scaled = clampedT * float(lineGradientCount - 1);
                int idx = int(floor(scaled));
                float f = fract(scaled);
                int idx2 = min(idx + 1, lineGradientCount - 1);
                vec3 c1 = lineGradient[idx];
                vec3 c2 = lineGradient[idx2];
                gradientColor = mix(c1, c2, f);
            }
            return gradientColor * 0.5;
        }

        float wave(vec2 uv, float offset, vec2 screenUv, vec2 mouseUv, bool shouldBend) {
            float time = iTime * animationSpeed;
            float x_offset   = offset;
            float x_movement = time * 0.1;
            float amp        = sin(offset + time * 0.2) * 0.3;
            float y          = sin(uv.x + x_offset + x_movement) * amp;

            if (shouldBend) {
                vec2 d = screenUv - mouseUv;
                float influence = exp(-dot(d, d) * bendRadius); 
                float bendOffset = (mouseUv.y - screenUv.y) * influence * bendStrength * bendInfluence;
                y += bendOffset;
            }

            float m = uv.y - y;
            return 0.0175 / max(abs(m) + 0.01, 1e-3) + 0.01;
        }

        void mainImage(out vec4 fragColor, in vec2 fragCoord) {
            vec2 baseUv = (2.0 * fragCoord - iResolution.xy) / iResolution.y;
            baseUv.y *= -1.0;
            
            if (parallax) { baseUv += parallaxOffset; }

            vec3 col = vec3(0.0);
            vec3 b = lineGradientCount > 0 ? vec3(0.0) : background_color(baseUv);

            vec2 mouseUv = vec2(0.0);
            if (interactive) {
                mouseUv = (2.0 * iMouse - iResolution.xy) / iResolution.y;
                mouseUv.y *= -1.0;
            }
            
            if (enableBottom) {
                for (int i = 0; i < bottomLineCount; ++i) {
                    float fi = float(i);
                    float t = fi / max(float(bottomLineCount - 1), 1.0);
                    vec3 lineCol = getLineColor(t, b);
                    float angle = bottomWavePosition.z * log(length(baseUv) + 1.0);
                    vec2 ruv = baseUv * rotate(angle);
                    col += lineCol * wave(
                        ruv + vec2(bottomLineDistance * fi + bottomWavePosition.x, bottomWavePosition.y),
                        1.5 + 0.2 * fi, baseUv, mouseUv, interactive
                    ) * 0.2;
                }
            }

            if (enableMiddle) {
                for (int i = 0; i < middleLineCount; ++i) {
                    float fi = float(i);
                    float t = fi / max(float(middleLineCount - 1), 1.0);
                    vec3 lineCol = getLineColor(t, b);
                    float angle = middleWavePosition.z * log(length(baseUv) + 1.0);
                    vec2 ruv = baseUv * rotate(angle);
                    col += lineCol * wave(
                        ruv + vec2(middleLineDistance * fi + middleWavePosition.x, middleWavePosition.y),
                        2.0 + 0.15 * fi, baseUv, mouseUv, interactive
                    );
                }
            }

            if (enableTop) {
                for (int i = 0; i < topLineCount; ++i) {
                    float fi = float(i);
                    float t = fi / max(float(topLineCount - 1), 1.0);
                    vec3 lineCol = getLineColor(t, b);
                    float angle = topWavePosition.z * log(length(baseUv) + 1.0);
                    vec2 ruv = baseUv * rotate(angle);
                    ruv.x *= -1.0;
                    col += lineCol * wave(
                        ruv + vec2(topLineDistance * fi + topWavePosition.x, topWavePosition.y),
                        1.0 + 0.2 * fi, baseUv, mouseUv, interactive
                    ) * 0.1;
                }
            }

            fragColor = vec4(col, 1.0);
        }

        void main() {
            vec4 color = vec4(0.0);
            mainImage(color, gl_FragCoord.xy);
            gl_FragColor = color;
        }
        `;

        // ==========================================
        // VANILLA JS IMPLEMENTATION
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('floating-lines-container');
            if (!container) return;

            // Your requested configuration
            const config = {
                enabledWaves: ["top", "middle", "bottom"],
                lineCount: 8,
                lineDistance: 8,
                bendRadius: 8,
                bendStrength: -2,
                interactive: true,
                parallax: true,
                animationSpeed: 1,
                linesGradient: ["#e945f5", "#6f6f6f", "#6a6a6a"],
                
                // Defaults translated from the React Component
                mouseDamping: 0.05,
                parallaxStrength: 0.2,
                topWavePosition: { x: 10.0, y: 0.5, rotate: -0.4 },
                middleWavePosition: { x: 5.0, y: 0.0, rotate: 0.2 },
                bottomWavePosition: { x: 2.0, y: -0.7, rotate: -1 }
            };

            const MAX_GRADIENT_STOPS = 8;

            function hexToVec3(hex) {
                let value = hex.trim();
                if (value.startsWith('#')) value = value.slice(1);
                let r = 255, g = 255, b = 255;
                if (value.length === 3) {
                    r = parseInt(value[0] + value[0], 16);
                    g = parseInt(value[1] + value[1], 16);
                    b = parseInt(value[2] + value[2], 16);
                } else if (value.length === 6) {
                    r = parseInt(value.slice(0, 2), 16);
                    g = parseInt(value.slice(2, 4), 16);
                    b = parseInt(value.slice(4, 6), 16);
                }
                return new THREE.Vector3(r / 255, g / 255, b / 255);
            }

            const targetMouse = new THREE.Vector2(-1000, -1000);
            const currentMouse = new THREE.Vector2(-1000, -1000);
            let targetInfluence = 0;
            let currentInfluence = 0;
            const targetParallax = new THREE.Vector2(0, 0);
            const currentParallax = new THREE.Vector2(0, 0);

            const scene = new THREE.Scene();
            const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            camera.position.z = 1;

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            container.appendChild(renderer.domElement);

            const uniforms = {
                iTime: { value: 0 },
                iResolution: { value: new THREE.Vector3(1, 1, 1) },
                animationSpeed: { value: config.animationSpeed },

                enableTop: { value: config.enabledWaves.includes('top') },
                enableMiddle: { value: config.enabledWaves.includes('middle') },
                enableBottom: { value: config.enabledWaves.includes('bottom') },

                topLineCount: { value: config.lineCount },
                middleLineCount: { value: config.lineCount },
                bottomLineCount: { value: config.lineCount },

                topLineDistance: { value: config.lineDistance * 0.01 },
                middleLineDistance: { value: config.lineDistance * 0.01 },
                bottomLineDistance: { value: config.lineDistance * 0.01 },

                topWavePosition: { value: new THREE.Vector3(config.topWavePosition.x, config.topWavePosition.y, config.topWavePosition.rotate) },
                middleWavePosition: { value: new THREE.Vector3(config.middleWavePosition.x, config.middleWavePosition.y, config.middleWavePosition.rotate) },
                bottomWavePosition: { value: new THREE.Vector3(config.bottomWavePosition.x, config.bottomWavePosition.y, config.bottomWavePosition.rotate) },

                iMouse: { value: new THREE.Vector2(-1000, -1000) },
                interactive: { value: config.interactive },
                bendRadius: { value: config.bendRadius },
                bendStrength: { value: config.bendStrength },
                bendInfluence: { value: 0 },

                parallax: { value: config.parallax },
                parallaxStrength: { value: config.parallaxStrength },
                parallaxOffset: { value: new THREE.Vector2(0, 0) },

                lineGradient: { value: Array.from({ length: MAX_GRADIENT_STOPS }, () => new THREE.Vector3(1, 1, 1)) },
                lineGradientCount: { value: 0 }
            };

            if (config.linesGradient && config.linesGradient.length > 0) {
                const stops = config.linesGradient.slice(0, MAX_GRADIENT_STOPS);
                uniforms.lineGradientCount.value = stops.length;
                stops.forEach((hex, i) => {
                    const color = hexToVec3(hex);
                    uniforms.lineGradient.value[i].set(color.x, color.y, color.z);
                });
            }

            const material = new THREE.ShaderMaterial({
                uniforms,
                vertexShader,
                fragmentShader
            });

            const geometry = new THREE.PlaneGeometry(2, 2);
            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            const clock = new THREE.Clock();

            const setSize = () => {
                const width = window.innerWidth;
                const height = window.innerHeight;
                renderer.setSize(width, height, false);
                uniforms.iResolution.value.set(renderer.domElement.width, renderer.domElement.height, 1);
            };

            setSize();
            window.addEventListener('resize', setSize);

            document.addEventListener('mousemove', event => {
                if (!config.interactive) return;
                const x = event.clientX;
                const y = event.clientY;
                const dpr = renderer.getPixelRatio();

                targetMouse.set(x * dpr, (window.innerHeight - y) * dpr);
                targetInfluence = 1.0;

                if (config.parallax) {
                    const centerX = window.innerWidth / 2;
                    const centerY = window.innerHeight / 2;
                    const offsetX = (x - centerX) / window.innerWidth;
                    const offsetY = -(y - centerY) / window.innerHeight;
                    targetParallax.set(offsetX * config.parallaxStrength, offsetY * config.parallaxStrength);
                }
            });

            document.addEventListener('mouseleave', () => {
                targetInfluence = 0.0;
            });

            const renderLoop = () => {
                uniforms.iTime.value = clock.getElapsedTime();

                if (config.interactive) {
                    currentMouse.lerp(targetMouse, config.mouseDamping);
                    uniforms.iMouse.value.copy(currentMouse);

                    currentInfluence += (targetInfluence - currentInfluence) * config.mouseDamping;
                    uniforms.bendInfluence.value = currentInfluence;
                }

                if (config.parallax) {
                    currentParallax.lerp(targetParallax, config.mouseDamping);
                    uniforms.parallaxOffset.value.copy(currentParallax);
                }

                renderer.render(scene, camera);
                requestAnimationFrame(renderLoop);
            };
            
            renderLoop();
        });
    </script>
</body>
</html>
