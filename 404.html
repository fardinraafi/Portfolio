<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Broken Pipeline | Fardin Rahman Khan Raafi</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/style.css">
    
    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>

    <style>
        /* 404 Specific Overrides */
        body.error-page {
            margin: 0;
            padding: 0;
            overflow: hidden; 
            background-color: #020617; 
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        /* The Intense Interactive Canvas Background */
        #neural-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: auto; /* Required for mouse repulsion */
        }

        .error-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 0 2rem;
            pointer-events: none; /* Let the mouse interact with the canvas behind the text */
        }

        .error-code {
            font-family: 'Syne', sans-serif;
            font-size: 10vw;
            font-weight: 800;
            line-height: 1;
            margin: 0;
            background: linear-gradient(135deg, #3B82F6, #8B5CF6, #DB2777);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(139, 92, 246, 0.4));
            animation: pulse-glow 3s infinite alternate;
        }

        .error-title {
            font-family: 'Syne', sans-serif;
            font-size: 2.2rem;
            color: #F8FAFC;
            margin-top: -0.5rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
            pointer-events: auto;
        }

        .error-desc {
            font-family: 'DM Sans', sans-serif;
            font-size: 1.1rem;
            color: #94A3B8;
            max-width: 600px;
            margin-bottom: 1.5rem;
            line-height: 1.5;
            pointer-events: auto;
        }

        /* 🚀 THE DINO GAME CONTAINER 🚀 */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 200px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            margin-bottom: 2rem;
            overflow: hidden;
            pointer-events: auto; /* Re-enable clicks for the game */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(59, 130, 246, 0.1);
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        #game-ui {
            position: absolute;
            top: 15px;
            right: 20px;
            font-family: 'Syne', monospace;
            font-weight: 700;
            color: var(--c1);
            font-size: 1rem;
            letter-spacing: 2px;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(37, 99, 235, 0.5);
        }

        #game-prompt {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            color: #F8FAFC;
            font-size: 1.2rem;
            pointer-events: none;
            animation: blink 1.5s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .error-btn-container {
            pointer-events: auto; 
        }

        .btn-glitch {
            position: relative;
            padding: 14px 36px;
            background: rgba(37, 99, 235, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.5);
            border-radius: 100px;
            color: #F8FAFC;
            font-weight: 800;
            font-size: 1rem;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .btn-glitch:hover {
            background: rgba(37, 99, 235, 0.3);
            border-color: #3B82F6;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.4);
            transform: translateY(-3px);
        }

        @keyframes pulse-glow {
            0% { filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.3)); }
            100% { filter: drop-shadow(0 0 50px rgba(139, 92, 246, 0.6)); }
        }

        /* 📱 MOBILE OPTIMIZATION MASTERY 📱 */
        @media (max-width: 768px) {
            .error-content { justify-content: flex-start; padding-top: 5vh; }
            .error-code { font-size: 5rem; margin-bottom: 0.5rem; }
            .error-title { font-size: 1.5rem; margin-top: 0; }
            .error-desc { font-size: 0.95rem; margin-bottom: 1rem; padding: 0 10px; }
            
            #game-container { 
                height: 220px; 
                width: 95%; 
                margin-bottom: 1.5rem; 
            }
            #game-prompt { font-size: 1rem; width: 100%; }
            .btn-glitch { padding: 12px 24px; font-size: 0.85rem; }
        }
        @media (max-height: 700px) {
            .error-code { font-size: 4rem; }
            .error-desc { display: none; }
        }
    </style>
</head>
<body class="error-page dark-mode">

    <!-- The Intense Interactive Physics Canvas -->
    <canvas id="neural-canvas"></canvas>

    <div class="error-content">
        <h1 class="error-code">404</h1>
        <h2 class="error-title">You've Fallen Out of the Funnel.</h2>
        <p class="error-desc">
            Even I cant predict a broken link. Play a quick game of "Pipeline Runner" while you're here, or head back to the homepage.
        </p>
        
        <!-- 🚀 THE GAME UI 🚀 -->
        <div id="game-container">
            <div id="game-ui">
                HI <span id="high-score">00000</span> | <span id="current-score">00000</span>
            </div>
            <div id="game-prompt">Press SPACE or TAP to play</div>
            <canvas id="game-canvas"></canvas>
        </div>

        <div class="error-btn-container">
            <a href="/index.html" class="btn-glitch">Return to Homepage</a>
        </div>
    </div>

    <script>
        // ==========================================
        // 🦖 NEON PIPELINE RUNNER (More Forgiving)
        // ==========================================
        const gCanvas = document.getElementById('game-canvas');
        const gCtx = gCanvas.getContext('2d');
        const promptEl = document.getElementById('game-prompt');
        const scoreEl = document.getElementById('current-score');
        const highScoreEl = document.getElementById('high-score');

        // Set canvas physical size
        function resizeGame() {
            gCanvas.width = gCanvas.parentElement.clientWidth;
            gCanvas.height = gCanvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeGame);
        resizeGame();

        // Game State Variables
        let isPlaying = false;
        let isGameOver = false;
        let score = 0;
        let highScore = localStorage.getItem('frkr_highscore') || 0;
        
        // SPEED TWEAKS: Slower base speed, softer acceleration
        let gameSpeed = 3.5; 
        let frameCount = 0;
        
        // Format score with leading zeros
        const formatScore = (s) => s.toString().padStart(5, '0');
        highScoreEl.innerText = formatScore(highScore);

        // Player (The Glowing Neon Box)
        const player = {
            x: 50,
            y: 150,
            w: 24,
            h: 24,
            dy: 0,
            jumpPower: -10.5,
            gravity: 0.55, // Slightly floatier jump
            grounded: false
        };

        let obstacles = [];

        // Input Controls (Spacebar & Mobile Tap)
        function jump() {
            if (isGameOver) {
                resetGame();
                return;
            }
            if (!isPlaying) {
                isPlaying = true;
                promptEl.style.display = 'none';
                requestAnimationFrame(gameLoop);
                return;
            }
            if (player.grounded) {
                player.dy = player.jumpPower;
                player.grounded = false;
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); 
                jump();
            }
        });

        // Mobile Tap Support FIX
        gCanvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            jump();
        }, {passive: false});
        
        gCanvas.addEventListener('mousedown', jump);

        function spawnObstacle() {
            let minGap = Math.max(80, 150 - (gameSpeed * 2)); 
            let maxGap = Math.max(150, 300 - (gameSpeed * 2));
            let gap = Math.floor(Math.random() * (maxGap - minGap + 1) + minGap);

            if (frameCount % gap === 0) {
                obstacles.push({
                    x: gCanvas.width,
                    y: gCanvas.height - 40,
                    w: Math.random() > 0.5 ? 18 : 28, 
                    h: Math.random() > 0.7 ? 45 : 30  
                });
            }
        }

        // REBOOT FIX: Force the animation loop to restart
        function resetGame() {
            isPlaying = true;
            isGameOver = false;
            score = 0;
            gameSpeed = 3.5;
            frameCount = 0;
            obstacles = [];
            player.y = gCanvas.height - 40 - player.h;
            player.dy = 0;
            promptEl.style.display = 'none';
            requestAnimationFrame(gameLoop); // Restart the engine
        }

        function drawPlayer() {
            gCtx.fillStyle = '#3B82F6'; 
            gCtx.shadowBlur = 15;
            gCtx.shadowColor = '#8B5CF6'; 
            gCtx.fillRect(player.x, player.y, player.w, player.h);
            gCtx.shadowBlur = 0; 
        }

        function drawObstacles() {
            gCtx.fillStyle = '#DB2777'; 
            gCtx.shadowBlur = 10;
            gCtx.shadowColor = '#DB2777';
            
            obstacles.forEach(obs => {
                gCtx.fillRect(obs.x, gCanvas.height - obs.h - 10, obs.w, obs.h);
            });
            gCtx.shadowBlur = 0;
        }

        function drawGround() {
            gCtx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            gCtx.lineWidth = 2;
            gCtx.beginPath();
            gCtx.moveTo(0, gCanvas.height - 10);
            gCtx.lineTo(gCanvas.width, gCanvas.height - 10);
            gCtx.stroke();
        }

        function gameLoop() {
            if (!isPlaying) return;

            gCtx.clearRect(0, 0, gCanvas.width, gCanvas.height);
            drawGround();

            player.dy += player.gravity;
            player.y += player.dy;

            if (player.y + player.h >= gCanvas.height - 10) {
                player.y = gCanvas.height - 10 - player.h;
                player.dy = 0;
                player.grounded = true;
            }

            drawPlayer();

            spawnObstacle();
            drawObstacles();

            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;

                if (
                    player.x < obs.x + obs.w &&
                    player.x + player.w > obs.x &&
                    player.y < gCanvas.height - 10 &&
                    player.y + player.h > gCanvas.height - obs.h - 10
                ) {
                    isGameOver = true;
                    isPlaying = false;
                }

                if (obs.x + obs.w < 0) {
                    obstacles.splice(i, 1);
                    i--;
                }
            }

            if (!isGameOver) {
                score += 0.05; 
                scoreEl.innerText = formatScore(Math.floor(score));
                
                // SPEED PROGRESSION: Slower ramp up, lower max speed
                if (gameSpeed < 9) {
                    gameSpeed += 0.001;
                }
                
                frameCount++;
                requestAnimationFrame(gameLoop);
            } else {
                gCtx.fillStyle = 'rgba(2, 6, 23, 0.7)';
                gCtx.fillRect(0, 0, gCanvas.width, gCanvas.height);
                promptEl.innerHTML = "SYSTEM FAILURE<br><span style='font-size:0.8rem;color:#94A3B8;'>Press SPACE or TAP to Reboot</span>";
                promptEl.style.display = 'block';
                promptEl.style.color = '#DB2777';
                
                if (Math.floor(score) > highScore) {
                    highScore = Math.floor(score);
                    localStorage.setItem('frkr_highscore', highScore);
                    highScoreEl.innerText = formatScore(highScore);
                }
            }
        }

        drawGround();
        drawPlayer();

        // ==========================================
        // 🕸️ INTENSE INTERACTIVE NEURAL NETWORK
        // ==========================================
        const canvas = document.getElementById('neural-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        let mouse = { x: null, y: null, radius: 150 };

        window.addEventListener('mousemove', (event) => {
            mouse.x = event.x;
            mouse.y = event.y;
        });

        window.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor(x, y, dx, dy, size, color) {
                this.x = x;
                this.y = y;
                this.dx = dx;
                this.dy = dy;
                this.size = size;
                this.color = color;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 30) + 1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            update() {
                if (mouse.x != null && mouse.y != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    let forceDirectionX = dx / distance;
                    let forceDirectionY = dy / distance;
                    let maxDistance = mouse.radius;
                    let force = (maxDistance - distance) / maxDistance;
                    let directionX = forceDirectionX * force * this.density;
                    let directionY = forceDirectionY * force * this.density;

                    if (distance < mouse.radius) {
                        this.x -= directionX;
                        this.y -= directionY;
                    } else {
                        if (this.x !== this.baseX) {
                            let dx = this.x - this.baseX;
                            this.x -= dx / 10;
                        }
                        if (this.y !== this.baseY) {
                            let dy = this.y - this.baseY;
                            this.y -= dy / 10;
                        }
                    }
                } else {
                    if (this.x !== this.baseX) {
                        let dx = this.x - this.baseX;
                        this.x -= dx / 10;
                    }
                    if (this.y !== this.baseY) {
                        let dy = this.y - this.baseY;
                        this.y -= dy / 10;
                    }
                }

                this.baseX += this.dx;
                this.baseY += this.dy;

                if (this.baseX < 0 || this.baseX > width) this.dx = -this.dx;
                if (this.baseY < 0 || this.baseY > height) this.dy = -this.dy;

                this.draw();
            }
        }

        function init() {
            particles = [];
            let numberOfParticles = (width * height) / 9000; 
            
            let colors = ['rgba(59, 130, 246, 0.8)', 'rgba(139, 92, 246, 0.8)', 'rgba(219, 39, 119, 0.8)'];

            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 2) + 1;
                let x = Math.random() * (innerWidth - size * 2 - size * 2) + size * 2;
                let y = Math.random() * (innerHeight - size * 2 - size * 2) + size * 2;
                let dx = (Math.random() - 0.5) * 1; 
                let dy = (Math.random() - 0.5) * 1; 
                let color = colors[Math.floor(Math.random() * colors.length)];
                
                particles.push(new Particle(x, y, dx, dy, size, color));
            }
        }

        function connect() {
            let opacityValue = 1;
            for (let a = 0; a < particles.length; a++) {
                for (let b = a; b < particles.length; b++) {
                    let distance = ((particles[a].x - particles[b].x) * (particles[a].x - particles[b].x)) 
                                 + ((particles[a].y - particles[b].y) * (particles[a].y - particles[b].y));
                    
                    if (distance < (width / 7) * (height / 7)) {
                        opacityValue = 1 - (distance / 20000);
                        ctx.strokeStyle = `rgba(139, 92, 246, ${opacityValue * 0.5})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, width, height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
            }
            connect();
        }

        init();
        animate();
    </script>
</body>
</html>
