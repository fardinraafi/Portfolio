<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Broken Pipeline | Fardin Rahman Khan Raafi</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Core Styles -->
    <link rel="stylesheet" href="/style.css">
    
    <!-- Vercel Analytics & Speed Insights -->
    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>

    <style>
        /* 404 Specific Overrides */
        body.error-page {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Locks the screen so they can't scroll away from the effect */
            background-color: #020617; /* Deepest dark mode background */
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        /* The Interactive Canvas Background */
        #neural-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: auto;
        }

        /* The Content Overlay */
        .error-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 0 2rem;
            pointer-events: none; /* Let the mouse interact with the canvas behind the text */
        }

        .error-code {
            font-family: 'Syne', sans-serif;
            font-size: 12vw;
            font-weight: 800;
            line-height: 1;
            margin: 0;
            background: linear-gradient(135deg, #3B82F6, #8B5CF6, #DB2777);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(139, 92, 246, 0.4));
            animation: pulse-glow 3s infinite alternate;
        }

        .error-title {
            font-family: 'Syne', sans-serif;
            font-size: 2.5rem;
            color: #F8FAFC;
            margin-top: -1rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .error-desc {
            font-family: 'DM Sans', sans-serif;
            font-size: 1.2rem;
            color: #94A3B8;
            max-width: 600px;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        /* Make the button clickable through the pointer-events: none overlay */
        .error-btn-container {
            pointer-events: auto; 
        }

        .btn-glitch {
            position: relative;
            padding: 16px 40px;
            background: rgba(37, 99, 235, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.5);
            border-radius: 100px;
            color: #F8FAFC;
            font-weight: 800;
            font-size: 1.1rem;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            overflow: hidden;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .btn-glitch:hover {
            background: rgba(37, 99, 235, 0.3);
            border-color: #3B82F6;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.4);
            transform: translateY(-3px);
        }

        @keyframes pulse-glow {
            0% { filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.3)); }
            100% { filter: drop-shadow(0 0 50px rgba(139, 92, 246, 0.6)); }
        }

        @media (max-width: 768px) {
            .error-code { font-size: 8rem; }
            .error-title { font-size: 1.8rem; }
            .error-desc { font-size: 1rem; }
        }
    </style>
    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body class="error-page dark-mode">

    <!-- The Interactive Physics Canvas -->
    <canvas id="neural-canvas"></canvas>

    <div class="error-content">
        <h1 class="error-code">404</h1>
        <h2 class="error-title">You've Fallen Out of the Funnel.</h2>
        <p class="error-desc">
            Even the most highly optimized B2B growth workflows can't predict a broken link. The data points scattered behind you represent a lost lead. Let's get you back to the main pipeline.
        </p>
        <div class="error-btn-container">
            <a href="/index.html" class="btn-glitch">Return to Homepage</a>
        </div>
    </div>

    <script>
        // ==========================================
        // 🚀 INTERACTIVE NEURAL NETWORK PHYSICS ENGINE
        // ==========================================
        const canvas = document.getElementById('neural-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        
        // Mouse interaction tracking
        let mouse = { x: null, y: null, radius: 150 };

        window.addEventListener('mousemove', (event) => {
            mouse.x = event.x;
            mouse.y = event.y;
        });

        window.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Particle Class
        class Particle {
            constructor(x, y, dx, dy, size, color) {
                this.x = x;
                this.y = y;
                this.dx = dx;
                this.dy = dy;
                this.size = size;
                this.color = color;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 30) + 1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            update() {
                // Collision with mouse (The Repulsion Effect)
                if (mouse.x != null && mouse.y != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    let forceDirectionX = dx / distance;
                    let forceDirectionY = dy / distance;
                    let maxDistance = mouse.radius;
                    let force = (maxDistance - distance) / maxDistance;
                    let directionX = forceDirectionX * force * this.density;
                    let directionY = forceDirectionY * force * this.density;

                    if (distance < mouse.radius) {
                        this.x -= directionX;
                        this.y -= directionY;
                    } else {
                        if (this.x !== this.baseX) {
                            let dx = this.x - this.baseX;
                            this.x -= dx / 10;
                        }
                        if (this.y !== this.baseY) {
                            let dy = this.y - this.baseY;
                            this.y -= dy / 10;
                        }
                    }
                } else {
                    // Float back to original position slowly if mouse leaves
                    if (this.x !== this.baseX) {
                        let dx = this.x - this.baseX;
                        this.x -= dx / 10;
                    }
                    if (this.y !== this.baseY) {
                        let dy = this.y - this.baseY;
                        this.y -= dy / 10;
                    }
                }

                // Natural drifting movement
                this.baseX += this.dx;
                this.baseY += this.dy;

                // Wall bouncing
                if (this.baseX < 0 || this.baseX > width) this.dx = -this.dx;
                if (this.baseY < 0 || this.baseY > height) this.dy = -this.dy;

                this.draw();
            }
        }

        // Initialize the Particle Network
        function init() {
            particles = [];
            // Calculates amount of particles based on screen size (keeps it responsive)
            let numberOfParticles = (width * height) / 9000; 
            
            let colors = ['rgba(59, 130, 246, 0.8)', 'rgba(139, 92, 246, 0.8)', 'rgba(219, 39, 119, 0.8)'];

            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 2) + 1;
                let x = Math.random() * (innerWidth - size * 2 - size * 2) + size * 2;
                let y = Math.random() * (innerHeight - size * 2 - size * 2) + size * 2;
                let dx = (Math.random() - 0.5) * 1; // Drift speed X
                let dy = (Math.random() - 0.5) * 1; // Drift speed Y
                let color = colors[Math.floor(Math.random() * colors.length)];
                
                particles.push(new Particle(x, y, dx, dy, size, color));
            }
        }

        // Connect the nodes with glowing lines
        function connect() {
            let opacityValue = 1;
            for (let a = 0; a < particles.length; a++) {
                for (let b = a; b < particles.length; b++) {
                    let distance = ((particles[a].x - particles[b].x) * (particles[a].x - particles[b].x)) 
                                 + ((particles[a].y - particles[b].y) * (particles[a].y - particles[b].y));
                    
                    if (distance < (width / 7) * (height / 7)) {
                        opacityValue = 1 - (distance / 20000);
                        ctx.strokeStyle = `rgba(139, 92, 246, ${opacityValue * 0.5})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, width, height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
            }
            connect();
        }

        init();
        animate();
    </script>
</body>
</html>
