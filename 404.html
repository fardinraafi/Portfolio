    <script>
    /* ===== Fifi speech bubble ===== */
    (() => {
        const say = document.getElementById('fifiSay');
        const face = document.getElementById('fifiFace');
        const LINES = [
            "yo bestie... this page got ghosted 👻",
            "404? that's a skill issue (on the link, not you) 💀",
            "lowkey lost? same. play a game with me 🎮",
            "this URL said 'new phone who dis' 📵",
            "no page here, only vibes ✨",
            "i searched everywhere. even under the CRM 🔍"
        ];
        const POKES = ["hey!! that tickles 😆", "boop received 🤖", "ok ok i'm awake ☕", "stop poking, start playing 😤", "W poke tbh 🫡"];
        let timer = null;
        const type = (text) => {
            clearTimeout(timer); say.classList.remove('done'); say.textContent = '';
            let i = 0;
            const step = () => { say.textContent = text.slice(0, ++i); if (i < text.length) timer = setTimeout(step, 28); else say.classList.add('done'); };
            step();
        };
        window.fifiSay = type;
        type(LINES[Math.floor(Math.random() * LINES.length)]);
        face.addEventListener('click', () => {
            face.classList.remove('boing'); void face.offsetWidth; face.classList.add('boing');
            type(POKES[Math.floor(Math.random() * POKES.length)]);
        });
    })();

    /* ===== FIFI RUN: a tiny endless runner ===== */
    (() => {
        const box = document.getElementById('game-container');
        const cv = document.getElementById('game-canvas');
        const g = cv.getContext('2d');
        const prompt = document.getElementById('game-prompt');
        const scoreEl = document.getElementById('current-score');
        const bestEl = document.getElementById('high-score');
        const say = (t) => window.fifiSay && window.fifiSay(t);

        let W = 0, H = 0, GROUND = 0;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const resize = () => {
            W = box.clientWidth; H = box.clientHeight; GROUND = H - 34;
            cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
            if (!running) drawScene(0);
        };

        let best = +(localStorage.getItem('frkr_highscore') || 0);
        bestEl.textContent = best;

        // --- state ---
        let running = false, over = false, speed, score, frame, jumpsLeft, last = 0, nextSpawn, nextGem, milestones = new Set();
        const fifi = { x: 64, y: 0, vy: 0, r: 20, sq: 1, onGround: true };
        let bugs = [], gems = [], parts = [], pops = [];
        const stars = Array.from({ length: 40 }, () => ({ x: Math.random(), y: Math.random() * 0.7, s: Math.random() * 1.5 + .4, p: Math.random() * 6 }));
        const hills = Array.from({ length: 6 }, (_, i) => ({ x: i * 160, h: 20 + Math.random() * 30 }));

        const reset = () => {
            speed = 5.2; score = 0; frame = 0; jumpsLeft = 2; nextSpawn = 70; nextGem = 140;
            fifi.y = GROUND - fifi.r; fifi.vy = 0; fifi.onGround = true; fifi.sq = 1;
            bugs = []; gems = []; parts = []; pops = []; milestones = new Set();
            scoreEl.textContent = 0;
        };

        const burst = (x, y, color, n = 10, up = 1) => {
            for (let i = 0; i < n; i++) parts.push({ x, y, vx: (Math.random() - .5) * 5, vy: -Math.random() * 4 * up, life: 1, c: color, s: Math.random() * 3 + 2 });
        };

        const jump = () => {
            if (!running) { start(); return; }
            if (jumpsLeft <= 0) return;
            fifi.vy = jumpsLeft === 2 ? -10.4 : -8.2;
            fifi.onGround = false; fifi.sq = 1.35;
            burst(fifi.x, fifi.y + fifi.r, jumpsLeft === 2 ? 'rgba(165,180,252,.9)' : 'rgba(244,114,182,.9)', jumpsLeft === 2 ? 8 : 14);
            jumpsLeft--;
        };

        const start = () => {
            reset(); running = true; over = false;
            prompt.style.display = 'none';
            say(["let's gooo 🏃‍♂️", "dodge the bugs, grab the leads 💎", "main character mode: ON 😎"][Math.floor(Math.random() * 3)]);
            last = performance.now(); requestAnimationFrame(loop);
        };

        const end = () => {
            running = false; over = true;
            box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
            burst(fifi.x, fifi.y, 'rgba(244,63,94,.95)', 24, 1.4);
            const s = Math.floor(score);
            let msg;
            if (s > best) { best = s; localStorage.setItem('frkr_highscore', best); bestEl.textContent = best; msg = `NEW HIGH SCORE ${s} 🏆 absolute W`; }
            else if (s < 10) msg = "bro tripped on the first bug 💀";
            else if (s < 40) msg = "not bad, not great. run it back? 🔁";
            else msg = "ok that was clean ngl 🔥";
            say(msg);
            prompt.innerHTML = `<span>Bug got you! Score ${s}</span><small class="pulse">Tap or press SPACE to try again</small>`;
            prompt.style.display = 'flex';
            const t0 = performance.now();
            const fade = (now) => { drawScene(now / 1000); if (now - t0 < 900) requestAnimationFrame(fade); };
            requestAnimationFrame(fade);
        };

        // --- drawing helpers ---
        const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); };

        function drawFifi(t) {
            const { x, y, r } = fifi;
            const sx = 1 / Math.sqrt(fifi.sq), sy = fifi.sq;
            g.save(); g.translate(x, y + r); g.scale(sx * 1.0, sy); g.translate(0, -r);
            if (over) g.rotate(Math.sin(t * 20) * 0.08);
            // legs (running)
            if (!over) {
                const k = fifi.onGround ? Math.sin(t * 22) * 5 : 3;
                g.strokeStyle = '#3B3FD8'; g.lineWidth = 4; g.lineCap = 'round';
                g.beginPath(); g.moveTo(-7, r - 4); g.lineTo(-7 + k, r + 7); g.moveTo(7, r - 4); g.lineTo(7 - k, r + 7); g.stroke();
            }
            // antennas
            g.strokeStyle = '#3B3FD8'; g.lineWidth = 3;
            g.beginPath(); g.moveTo(-r * .8, -r * .35); g.lineTo(-r * .8, -r * .95); g.moveTo(r * .8, -r * .35); g.lineTo(r * .8, -r * .95); g.stroke();
            g.fillStyle = '#F472B6'; g.beginPath(); g.arc(-r * .8, -r * .98, 3, 0, 7); g.arc(r * .8, -r * .98, 3, 0, 7); g.fill();
            // ear pods
            g.fillStyle = '#3B3FD8'; rr(-r * 1.12, -r * .35, r * .3, r * .8, 5); g.fill(); rr(r * .82, -r * .35, r * .3, r * .8, 5); g.fill();
            // head
            g.shadowColor = 'rgba(99,102,241,.8)'; g.shadowBlur = 16;
            g.fillStyle = '#4448E8'; g.beginPath(); g.ellipse(0, 0, r, r * .85, 0, 0, 7); g.fill(); g.shadowBlur = 0;
            // face plate
            g.fillStyle = '#fff'; rr(-r * .7, -r * .48, r * 1.4, r * .96, r * .4); g.fill();
            // eyes + mouth
            g.strokeStyle = '#3B3FD8'; g.lineWidth = 2.4; g.lineCap = 'round';
            if (over) {
                [[-r * .32, -r * .08], [r * .32, -r * .08]].forEach(([ex, ey]) => { g.beginPath(); g.moveTo(ex - 4, ey - 4); g.lineTo(ex + 4, ey + 4); g.moveTo(ex + 4, ey - 4); g.lineTo(ex - 4, ey + 4); g.stroke(); });
                g.beginPath(); g.arc(0, r * .3, 3.5, 0, 7); g.stroke();
            } else {
                const blink = (Math.sin(t * 1.7) > .97);
                const happy = !fifi.onGround;
                [-1, 1].forEach(s => {
                    g.beginPath();
                    if (blink) { g.moveTo(s * r * .32 - 4, -r * .08); g.lineTo(s * r * .32 + 4, -r * .08); }
                    else if (happy) { g.moveTo(s * r * .32 - 4, -r * .02); g.lineTo(s * r * .32, -r * .2); g.lineTo(s * r * .32 + 4, -r * .02); }
                    else g.arc(s * r * .32, -r * .02, 4.2, Math.PI * 1.1, Math.PI * 1.9);
                    g.stroke();
                });
                g.beginPath(); g.arc(0, r * .16, 4, .15 * Math.PI, .85 * Math.PI); g.stroke();
                g.fillStyle = 'rgba(244,114,182,.45)'; g.beginPath(); g.arc(-r * .5, r * .15, 3, 0, 7); g.arc(r * .5, r * .15, 3, 0, 7); g.fill();
            }
            g.restore();
            // shadow on ground
            const d = Math.max(0, (GROUND - (fifi.y + r)) / 120);
            g.fillStyle = `rgba(0,0,0,${.35 - d * .25})`; g.beginPath(); g.ellipse(x, GROUND + 4, r * (1 - d * .5), 4, 0, 0, 7); g.fill();
        }

        function drawBug(b, t) {
            const wob = Math.sin(t * 12 + b.x * .05) * 2;
            g.save(); g.translate(b.x, GROUND - b.h / 2 + wob * .3);
            g.shadowColor = 'rgba(244,63,94,.7)'; g.shadowBlur = 14;
            g.fillStyle = b.c; rr(-b.w / 2, -b.h / 2, b.w, b.h, Math.min(b.w, b.h) * .45); g.fill(); g.shadowBlur = 0;
            // spikes on top
            g.fillStyle = b.c; for (let i = -1; i <= 1; i++) { g.beginPath(); g.moveTo(i * b.w * .25 - 4, -b.h / 2 + 2); g.lineTo(i * b.w * .25, -b.h / 2 - 7); g.lineTo(i * b.w * .25 + 4, -b.h / 2 + 2); g.fill(); }
            // angry eyes
            g.fillStyle = '#fff'; g.beginPath(); g.arc(-b.w * .2, -b.h * .12, 4.5, 0, 7); g.arc(b.w * .2, -b.h * .12, 4.5, 0, 7); g.fill();
            g.fillStyle = '#0F172A'; g.beginPath(); g.arc(-b.w * .2 - 1, -b.h * .1, 2.2, 0, 7); g.arc(b.w * .2 - 1, -b.h * .1, 2.2, 0, 7); g.fill();
            g.strokeStyle = '#0F172A'; g.lineWidth = 2; g.beginPath(); g.moveTo(-b.w * .32, -b.h * .3); g.lineTo(-b.w * .08, -b.h * .2); g.moveTo(b.w * .32, -b.h * .3); g.lineTo(b.w * .08, -b.h * .2); g.stroke();
            // little feet
            g.strokeStyle = b.c; g.lineWidth = 3; const k = Math.sin(t * 18 + b.x) * 3;
            g.beginPath(); g.moveTo(-b.w * .25, b.h / 2 - 2); g.lineTo(-b.w * .25 + k, b.h / 2 + 4); g.moveTo(b.w * .25, b.h / 2 - 2); g.lineTo(b.w * .25 - k, b.h / 2 + 4); g.stroke();
            g.restore();
        }

        function drawGem(m, t) {
            const y = m.y + Math.sin(t * 4 + m.x * .02) * 4;
            g.save(); g.translate(m.x, y); g.rotate(Math.sin(t * 3) * .2);
            g.shadowColor = 'rgba(52,211,153,.9)'; g.shadowBlur = 16;
            g.fillStyle = '#34D399'; g.beginPath(); g.moveTo(0, -10); g.lineTo(9, -2); g.lineTo(0, 11); g.lineTo(-9, -2); g.closePath(); g.fill();
            g.shadowBlur = 0; g.fillStyle = 'rgba(255,255,255,.7)'; g.beginPath(); g.moveTo(0, -10); g.lineTo(4, -2); g.lineTo(0, 2); g.lineTo(-4, -2); g.closePath(); g.fill();
            g.restore();
        }

        function drawScene(t) {
            g.clearRect(0, 0, W, H);
            // stars
            stars.forEach(s => {
                const a = .35 + Math.sin(t * 2 + s.p) * .3;
                g.fillStyle = `rgba(199,210,254,${a})`; g.beginPath(); g.arc(((s.x * W - (running ? frame * .3 : 0)) % W + W) % W, s.y * H, s.s, 0, 7); g.fill();
            });
            // moon
            g.fillStyle = 'rgba(244,114,182,.18)'; g.beginPath(); g.arc(W - 70, 52, 22, 0, 7); g.fill();
            // hills (parallax)
            g.fillStyle = 'rgba(99,102,241,.13)';
            hills.forEach(hl => {
                const x = ((hl.x - (running ? frame * speed * .25 : 0)) % (W + 200) + W + 200) % (W + 200) - 100;
                g.beginPath(); g.ellipse(x, GROUND, 90, hl.h, 0, Math.PI, 0); g.fill();
            });
            // ground
            const grad = g.createLinearGradient(0, GROUND, W, GROUND);
            grad.addColorStop(0, 'rgba(37,99,235,.7)'); grad.addColorStop(.5, 'rgba(124,58,237,.8)'); grad.addColorStop(1, 'rgba(219,39,119,.7)');
            g.fillStyle = grad; g.fillRect(0, GROUND, W, 2);
            g.fillStyle = 'rgba(148,163,184,.25)';
            for (let i = 0; i < W / 40 + 2; i++) g.fillRect(((i * 40 - frame * speed) % (W + 40) + W + 40) % (W + 40) - 20, GROUND + 12, 14, 2);

            gems.forEach(m => drawGem(m, t));
            bugs.forEach(b => drawBug(b, t));
            drawFifi(t);

            // particles
            parts.forEach(p => { g.globalAlpha = Math.max(0, p.life); g.fillStyle = p.c; g.beginPath(); g.arc(p.x, p.y, p.s, 0, 7); g.fill(); });
            g.globalAlpha = 1;
            // floating "+5" texts
            pops.forEach(p => { g.globalAlpha = Math.max(0, p.life); g.fillStyle = p.c; g.font = '800 15px Syne, sans-serif'; g.textAlign = 'center'; g.fillText(p.t, p.x, p.y); });
            g.globalAlpha = 1;
            if (over) { g.fillStyle = 'rgba(2,6,23,.45)'; g.fillRect(0, 0, W, H); }
        }

        function loop(now) {
            if (!running) return;
            const dt = Math.min(2.5, (now - last) / 16.667); last = now;
            frame += dt;

            // physics
            fifi.vy += 0.55 * dt; fifi.y += fifi.vy * dt;
            if (fifi.y - fifi.r < 30) { fifi.y = fifi.r + 30; if (fifi.vy < 0) fifi.vy = 0; } // stay inside the box
            if (fifi.y + fifi.r >= GROUND) {
                if (!fifi.onGround) { fifi.sq = .7; burst(fifi.x, GROUND, 'rgba(148,163,184,.8)', 6, .6); }
                fifi.y = GROUND - fifi.r; fifi.vy = 0; fifi.onGround = true; jumpsLeft = 2;
            }
            fifi.sq += (1 - fifi.sq) * .18 * dt;

            // spawn bugs
            nextSpawn -= dt;
            if (nextSpawn <= 0) {
                const big = Math.random() < Math.min(.45, .15 + score / 300);
                const pair = score > 60 && Math.random() < .2;
                const mk = (off) => ({ x: W + 30 + off, w: big ? 36 : 28, h: big ? 40 : 26, c: ['#F43F5E', '#EC4899', '#F97316'][Math.floor(Math.random() * 3)], passed: false });
                bugs.push(mk(0)); if (pair) bugs.push(mk(34));
                const minGap = Math.max(48, 90 - speed * 3);
                nextSpawn = minGap + Math.random() * 70;
            }
            // spawn gems ("leads")
            nextGem -= dt;
            if (nextGem <= 0) { gems.push({ x: W + 20, y: GROUND - 60 - Math.random() * 60 }); nextGem = 110 + Math.random() * 140; }

            bugs.forEach(b => b.x -= speed * dt);
            gems.forEach(m => m.x -= speed * dt);
            bugs = bugs.filter(b => b.x > -60); gems = gems.filter(m => m.x > -30 && !m.got);

            // collisions (a bit forgiving)
            for (const b of bugs) {
                const dx = Math.abs(fifi.x - b.x), top = GROUND - b.h;
                if (dx < b.w / 2 + fifi.r * .7 && fifi.y + fifi.r * .75 > top) { end(); return; }
                if (!b.passed && b.x < fifi.x - 10) { b.passed = true; score += 1; }
            }
            for (const m of gems) {
                if (Math.hypot(fifi.x - m.x, fifi.y - m.y) < fifi.r + 10) {
                    m.got = true; score += 5;
                    burst(m.x, m.y, 'rgba(52,211,153,.95)', 14);
                    pops.push({ x: m.x, y: m.y - 10, t: '+5 lead 💎', life: 1, c: '#6EE7B7' });
                    if (Math.random() < .35) say(["lead captured 💎", "CRM going crazy rn 📈", "sales team will love this 🤑"][Math.floor(Math.random() * 3)]);
                }
            }

            // effects
            parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += .2 * dt; p.life -= .03 * dt; });
            parts = parts.filter(p => p.life > 0);
            pops.forEach(p => { p.y -= .8 * dt; p.life -= .02 * dt; });
            pops = pops.filter(p => p.life > 0);

            score += 0.02 * dt;
            const s = Math.floor(score);
            if (scoreEl.textContent != s) {
                scoreEl.textContent = s;
                if (s > 0 && s % 50 === 0 && !milestones.has(s)) {
                    milestones.add(s);
                    for (let i = 0; i < 30; i++) parts.push({ x: Math.random() * W, y: -10, vx: (Math.random() - .5) * 2, vy: Math.random() * 3, life: 1.6, c: ['#60A5FA', '#A78BFA', '#F472B6', '#34D399'][i % 4], s: 3 });
                    say(`${s} points?? you're cooking 🔥`);
                }
            }
            speed = Math.min(11, speed + 0.0016 * dt);

            drawScene(now / 1000);
            requestAnimationFrame(loop);
        }

        // --- input ---
        const onPress = (e) => { e.preventDefault(); jump(); };
        box.addEventListener('pointerdown', onPress);
        window.addEventListener('keydown', (e) => {
            if (e.target.closest && e.target.closest('input, textarea, button, a, [contenteditable]')) return;
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); jump(); }
        });

        window.addEventListener('resize', resize);
        resize(); reset();
        // idle animation before the game starts
        const idle = (now) => { if (running || over) return; drawScene(now / 1000); requestAnimationFrame(idle); };
        requestAnimationFrame(idle);
    })();
    </script>

    <script>
        // 🕸️ INTENSE INTERACTIVE NEURAL NETWORK
        // ==========================================
        const canvas = document.getElementById('neural-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        let mouse = { x: null, y: null, radius: 150 };

        window.addEventListener('mousemove', (event) => {
            mouse.x = event.x;
            mouse.y = event.y;
        });

        window.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor(x, y, dx, dy, size, color) {
                this.x = x;
                this.y = y;
                this.dx = dx;
                this.dy = dy;
                this.size = size;
                this.color = color;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 30) + 1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            update() {
                if (mouse.x != null && mouse.y != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    let forceDirectionX = dx / distance;
                    let forceDirectionY = dy / distance;
                    let maxDistance = mouse.radius;
                    let force = (maxDistance - distance) / maxDistance;
                    let directionX = forceDirectionX * force * this.density;
                    let directionY = forceDirectionY * force * this.density;

                    if (distance < mouse.radius) {
                        this.x -= directionX;
                        this.y -= directionY;
                    } else {
                        if (this.x !== this.baseX) {
                            let dx = this.x - this.baseX;
                            this.x -= dx / 10;
                        }
                        if (this.y !== this.baseY) {
                            let dy = this.y - this.baseY;
                            this.y -= dy / 10;
                        }
                    }
                } else {
                    if (this.x !== this.baseX) {
                        let dx = this.x - this.baseX;
                        this.x -= dx / 10;
                    }
                    if (this.y !== this.baseY) {
                        let dy = this.y - this.baseY;
                        this.y -= dy / 10;
                    }
                }

                this.baseX += this.dx;
                this.baseY += this.dy;

                if (this.baseX < 0 || this.baseX > width) this.dx = -this.dx;
                if (this.baseY < 0 || this.baseY > height) this.dy = -this.dy;

                this.draw();
            }
        }

        function init() {
            particles = [];
            let numberOfParticles = (width * height) / 9000; 
            
            let colors = ['rgba(59, 130, 246, 0.8)', 'rgba(139, 92, 246, 0.8)', 'rgba(219, 39, 119, 0.8)'];

            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 2) + 1;
                let x = Math.random() * (innerWidth - size * 2 - size * 2) + size * 2;
                let y = Math.random() * (innerHeight - size * 2 - size * 2) + size * 2;
                let dx = (Math.random() - 0.5) * 1; 
                let dy = (Math.random() - 0.5) * 1; 
                let color = colors[Math.floor(Math.random() * colors.length)];
                
                particles.push(new Particle(x, y, dx, dy, size, color));
            }
        }

        function connect() {
            let opacityValue = 1;
            for (let a = 0; a < particles.length; a++) {
                for (let b = a; b < particles.length; b++) {
                    let distance = ((particles[a].x - particles[b].x) * (particles[a].x - particles[b].x)) 
                                 + ((particles[a].y - particles[b].y) * (particles[a].y - particles[b].y));
                    
                    if (distance < (width / 7) * (height / 7)) {
                        opacityValue = 1 - (distance / 20000);
                        ctx.strokeStyle = `rgba(139, 92, 246, ${opacityValue * 0.5})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, width, height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
            }
            connect();
        }

        init();
        animate();
    </script>
