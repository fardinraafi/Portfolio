    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="/style.css">
    
    <style>
        /* Specific Styles for the Hover Overlay Gallery */
        .collage-item {
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            cursor: pointer;
        }
        
        .grid-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
            display: block;
            transition: transform 0.4s ease;
        }
        
        /* The Dark Overlay that sits invisible over the image */
        .gallery-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.85); /* Deep dark blue fade */
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            text-align: center;
            opacity: 0; /* Invisible by default */
            transition: opacity 0.4s ease;
            z-index: 2;
        }
        
        /* The Text inside the overlay */
        .gallery-overlay p {
            color: #F8FAFC;
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            line-height: 1.4;
            transform: translateY(20px); /* Starts slightly lower */
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            margin: 0;
        }
        
        /* When user hovers over the container */
        .collage-item:hover .gallery-overlay {
            opacity: 1; /* Fade in the dark background */
        }
        
        .collage-item:hover .grid-img {
            transform: scale(1.05); /* Slight zoom on image */
        }
        
        .collage-item:hover .gallery-overlay p {
            transform: translateY(0); /* Slide text up into place */
        }
    </style>
</head>
<body class="dark-mode">
    
<div id="preloader">
    <div class="preloader-text">FR<span class="gradient-text">KR</span></div>
</div>

<div class="bg-mesh"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>

<nav class="top-nav"></nav>

<div class="layout-wrapper single-column">
    <header style="text-align: center; margin-bottom: 3rem;">
        <h1 class="gradient-text">Visual Highlights</h1>
        <p style="color: var(--text-muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto;">
            A curated collection of my creative direction, brand campaigns, and visual marketing assets.
        </p>
    </header>

    <div class="collage-grid" id="gallery-grid"></div>
</div>

<div id="lightbox-overlay" class="lightbox-overlay">
    <div class="lightbox-content">
        <button class="lightbox-close" onclick="window.closeLightbox()">×</button>
        <button class="lightbox-nav lightbox-prev" onclick="window.changeImage(-1, event)">❮</button>
        <img id="lightbox-img" class="lightbox-img" src="" alt="Full Screen Preview">
        <button class="lightbox-nav lightbox-next" onclick="window.changeImage(1, event)">❯</button>
    </div>
</div>

<footer class="site-footer"></footer>

<button id="scrollTopBtn" class="scroll-to-top" aria-label="Scroll to top">↑</button>

<script src="/main.js"></script>

</body>
