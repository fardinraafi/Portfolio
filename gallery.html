    <style>
        /* 🎨 DYNAMIC PINTEREST/MASONRY GRID 🎨 */
        .collage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            grid-auto-rows: 280px; /* Base height for standard images */
            gap: 1.5rem;
            padding: 1rem;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* The dynamic size classes */
        .span-large { grid-column: span 2; grid-row: span 2; }
        .span-2-col { grid-column: span 2; }
        .span-2-row { grid-row: span 2; }

        .collage-item {
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            cursor: pointer;
            height: 100%;
            width: 100%;
            transform-style: preserve-3d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2), inset 0 0 0 1px rgba(255,255,255,0.05);
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.4s ease;
            background: #0f172a;
        }

        .grid-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 20px;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.6s ease;
            filter: brightness(0.9);
        }

        /* Premium Dark Glass Overlay */
        .gallery-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(15, 23, 42, 0.95) 0%, rgba(15, 23, 42, 0.4) 40%, transparent 100%);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 2rem 1.5rem;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 2;
        }

        .gallery-overlay p {
            color: #F8FAFC;
            font-family: 'DM Sans', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            line-height: 1.5;
            transform: translateY(20px);
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            margin: 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        /* Hover Physics */
        .collage-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(124, 58, 237, 0.3), 0 0 20px rgba(37, 99, 235, 0.2);
            z-index: 10;
        }
        .collage-item:hover .grid-img {
            transform: scale(1.08);
            filter: brightness(1);
        }
        .collage-item:hover .gallery-overlay { opacity: 1; }
        .collage-item:hover .gallery-overlay p { transform: translateY(0); }

        /* 🚀 THE 48TH CTA CARD 🚀 */
        .cta-card {
            background: linear-gradient(135deg, rgba(37,99,235,0.1), rgba(124,58,237,0.1));
            border: 1px solid rgba(124,58,237,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 2rem;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }
        .cta-card:hover {
            background: linear-gradient(135deg, rgba(37,99,235,0.2), rgba(124,58,237,0.2));
            border-color: var(--c2);
        }
        .cta-card h3 {
            font-family: 'Syne', sans-serif;
            color: #F8FAFC;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            line-height: 1.3;
        }
        .cta-card .btn { margin-top: 1rem; }

        /* 🚀 SWIPEABLE CINEMATIC LIGHTBOX UI 🚀 */
        .lightbox-overlay { 
            position: fixed; inset: 0; background: rgba(10, 15, 30, 0.98); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            opacity: 0; visibility: hidden; transition: all 0.4s ease; 
        }
        .lightbox-overlay.active { opacity: 1; visibility: visible; }
        
        .lightbox-content { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; touch-action: none; }
        
        .lightbox-img { 
            max-width: 85vw; max-height: 80vh; border-radius: 12px; box-shadow: 0 30px 60px rgba(0,0,0,0.6); 
            object-fit: contain; transform: scale(0.95); opacity: 0; transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.4s ease; 
            user-select: none; -webkit-user-drag: none; border: 1px solid rgba(255,255,255,0.05);
        }
        .lightbox-overlay.active .lightbox-img { transform: scale(1); opacity: 1; }
        
        .lightbox-nav { 
            position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); 
            color: #fff; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            font-size: 1.5rem; cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); backdrop-filter: blur(10px); z-index: 10;
        }
        .lightbox-nav:hover { background: rgba(255,255,255,0.15); transform: translateY(-50%) scale(1.1); box-shadow: 0 0 25px rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); }
        .lightbox-prev { left: 40px; }
        .lightbox-next { right: 40px; }
        
        .lightbox-close { 
            position: absolute; top: 30px; right: 40px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); 
            color: #fff; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            font-size: 1.5rem; cursor: pointer; transition: all 0.3s; z-index: 100; backdrop-filter: blur(10px);
        }
        .lightbox-close:hover { background: rgba(239, 68, 68, 0.2); transform: rotate(90deg) scale(1.1); color: #FCA5A5; border-color: rgba(239, 68, 68, 0.4); }
        
        .lightbox-caption { 
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.8); 
            padding: 14px 30px; border-radius: 100px; color: #fff; font-family: 'Syne', sans-serif; font-size: 1.1rem; 
            font-weight: 700; backdrop-filter: blur(15px); text-align: center; max-width: 70%; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); letter-spacing: 0.02em;
        }

        /* Mobile Adjustments: Collapse grid down to 1 column on small screens so it doesn't break */
        @media (max-width: 768px) {
            .collage-grid { grid-template-columns: 1fr; grid-auto-rows: auto; }
            .span-large, .span-2-col, .span-2-row { grid-column: span 1; grid-row: span 1; height: 300px; }
            .lightbox-prev, .lightbox-next { display: none; }
            .lightbox-img { max-width: 100vw; max-height: 75vh; border-radius: 0; border: none; }
            .lightbox-caption { bottom: 20px; font-size: 0.9rem; padding: 12px 20px; width: 90%; }
            .lightbox-close { top: 15px; right: 15px; width: 40px; height: 40px; }
        }
    </style>
</head>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const galleryGrid = document.getElementById('gallery-grid');
    if (galleryGrid) {
        
        // 🚀 THE SMART ARRAY: Simply cut and paste these entire lines to change the order!
        const galleryItems = [
            { id: 39, text: "Volunteered for February Mother Language Day, Rotaract Club" },

            { id: 2, text: "Rotaract Club Art Competition for Children" },
            { id: 14, text: "Standing between my desings at BUBT Business Club Workshop" },
            { id: 15, text: "Lead Academy Town Hall Meeting 2025" },
            { id: 16, text: "Year Launching Meeting as Secretary of Rotaract Club of Dhaka Dynamic" },
            { id: 17, text: "Welcoming Speech for New Volunteers at BUBT Social Welfare Club" },
            { id: 18, text: "World Polio Day Rally Participation, Rotaract" },
            { id: 19, text: "Rotaract Project - Flood rehabilitation" },
            { id: 20, text: "World Polio Day Rally 2025" },
            { id: 34, text: "TEDxUttara announcement Card" },
            { id: 23, text: "Speech at Rotaract Conference" },
            { id: 24, text: "I was the Program Chairman and Host of the General Meeting of Rotaract Club of Dhaka Dynamic" },
            { id: 25, text: "Leader of the Year 2024 prize from BASIS, BUBT" },
            { id: 27, text: "Crest from Rotaract Club of Dhaka Udayan for Best Attendance" },
            { id: 28, text: "With my teammates at TEDxUttara" },
            { id: 29, text: "On Stage receiving Crest from the OC head Sumaiya Apu" },
            { id: 30, text: "Hult Prize Crest alongside all my design work" },
            { id: 31, text: "Won best speaker at - YSSE Speaking Competition" },
            { id: 32, text: "Basis Leader of the year Card" },
            { id: 33, text: "Booth work for BizzMasters S1, BUBT Business Club" },
            { id: 22, text: "With my media prize for excellence, BizzMasters Season 1" },
            { id: 35, text: "Volunteered for Polio Awareness, 2025" },
            { id: 36, text: "Featuring in ILC Official Page" },
            { id: 37, text: "Received Crest for Best Attendance at Rotary SPARK 2025" },
            { id: 38, text: "Received Leader of the Year Award, BASIS, BUBT" },
            { id: 40, text: "Volunteered for 21st February Mother Language Day, Rotaract Club" },
            { id: 41, text: "Won the YSSE Presentation Competition" },
            { id: 1, text: "BUBT Business Club Booth Incharge Duty 2025" },
            { id: 43, text: "Leading the Polio Awareness Rally at Rotaract, 2023" },
            { id: 44, text: "Won best Leader of the Week, YSSE" },
            { id: 47, text: "Workshop Management Duty, Creative IT, 2025" },
            { id: 46, text: "BASIS Leader of the Year Prize and Certification, 2023" },
            { id: 45, text: "Won Best Speaker, YSSE" },
        ];

        let galleryHTML = '';

        galleryItems.forEach((item, index) => {
            // The masonry grid needs to know its visual position to mix up the sizes correctly
            const visualPosition = index + 1;
            
            let spanClass = '';
            if (visualPosition % 7 === 1) spanClass = 'span-large';
            else if (visualPosition % 5 === 0) spanClass = 'span-2-col';
            else if (visualPosition % 11 === 0) spanClass = 'span-2-row';

            // Now pulling the specific image ID and specific text from the smart array
            galleryHTML += `
            <div class="collage-item ${spanClass}" data-tilt data-tilt-max="5" data-tilt-speed="400">
                <img src="/gallery/gallery_${item.id}.webp" class="grid-img" loading="lazy" alt="${item.text}" onerror="this.parentElement.style.display='none'">
                <div class="gallery-overlay">
                    <p>${item.text}</p>
                </div>
            </div>`;
        });

        // 🚀 THE 48TH CTA CARD 🚀
        galleryHTML += `
        <a href="/contact.html" class="collage-item cta-card span-2-col" data-tilt data-tilt-max="5" data-tilt-speed="400">
            <h3>Have a project in mind?</h3>
            <p style="color: var(--text-muted); font-size: 0.95rem;">Let's create something amazing together.</p>
            <span class="btn btn-primary" style="margin-top: 1.5rem;">Let's Talk ➔</span>
        </a>`;

        galleryGrid.innerHTML = galleryHTML;
        
        VanillaTilt.init(document.querySelectorAll(".collage-item"));
    }
    // --- SWIPEABLE LIGHTBOX LOGIC ---
    const lightbox = document.getElementById('lightbox-overlay');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxCaption = document.getElementById('lightbox-caption');
    
    let imageList = [];
    let currentIndex = 0;

    if(galleryGrid && lightbox) {
        galleryGrid.addEventListener('click', (e) => {
            const item = e.target.closest('.collage-item');
            // Prevent Lightbox from opening if they clicked the CTA Card!
            if (!item || item.classList.contains('cta-card')) return;
            
            // Gather all currently visible images for the swipe loop
            const currentImages = Array.from(document.querySelectorAll('.grid-img')).filter(img => img.parentElement.style.display !== 'none');
            imageList = currentImages.map(img => ({ src: img.src, alt: img.alt }));
            
            const clickedImg = item.querySelector('.grid-img');
            currentIndex = imageList.findIndex(img => img.src === clickedImg.src);
            
            updateLightbox();
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden'; // Stop background scrolling
        });

        function updateLightbox() {
            if(imageList.length === 0) return;
            lightboxImg.style.opacity = '0';
            lightboxImg.style.transform = 'scale(0.95)';
            
            setTimeout(() => {
                lightboxImg.src = imageList[currentIndex].src;
                lightboxCaption.textContent = imageList[currentIndex].alt;
                lightboxImg.style.opacity = '1';
                lightboxImg.style.transform = 'scale(1)';
            }, 200); // Smooth crossfade delay
        }

        function changeImage(step) {
            if(imageList.length === 0) return;
            currentIndex += step;
            if (currentIndex < 0) currentIndex = imageList.length - 1;
            if (currentIndex >= imageList.length) currentIndex = 0;
            updateLightbox();
        }

        // Button Controls
        document.getElementById('lightbox-prev').addEventListener('click', (e) => { e.stopPropagation(); changeImage(-1); });
        document.getElementById('lightbox-next').addEventListener('click', (e) => { e.stopPropagation(); changeImage(1); });
        
        // Close controls
        const closeLightbox = () => { lightbox.classList.remove('active'); document.body.style.overflow = ''; };
        document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => { if (e.target === lightbox || e.target.classList.contains('lightbox-content')) closeLightbox(); });

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') changeImage(-1);
            if (e.key === 'ArrowRight') changeImage(1);
        });

        // Mobile Touch Swipe controls
        let touchStartX = 0, touchEndX = 0;
        const lightboxContent = document.getElementById('lightbox-content');
        
        lightboxContent.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, {passive: true});
        lightboxContent.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 50) changeImage(1); // Swipe Left
            if (touchEndX - touchStartX > 50) changeImage(-1); // Swipe Right
        }, {passive: true});
    }
});
</script>
