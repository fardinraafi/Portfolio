    <style>
        /* Specific Styles for the Hover Overlay Gallery */
        .collage-item { position: relative; overflow: hidden; border-radius: 16px; cursor: pointer; }
        .grid-img { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; display: block; transition: transform 0.4s ease; }
        
        .gallery-overlay {
            position: absolute; inset: 0; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center; padding: 1.5rem; text-align: center;
            opacity: 0; transition: opacity 0.4s ease; z-index: 2;
        }
        .gallery-overlay p { color: #F8FAFC; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 1rem; line-height: 1.4; transform: translateY(20px); transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); margin: 0; }
        
        .collage-item:hover .gallery-overlay { opacity: 1; }
        .collage-item:hover .grid-img { transform: scale(1.05); }
        .collage-item:hover .gallery-overlay p { transform: translateY(0); }

        /* 🚀 STUNNING SWIPEABLE LIGHTBOX UI 🚀 */
        .lightbox-overlay { 
            position: fixed; inset: 0; background: rgba(10, 15, 30, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            opacity: 0; visibility: hidden; transition: all 0.4s ease; 
        }
        .lightbox-overlay.active { opacity: 1; visibility: visible; }
        .lightbox-content { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; touch-action: none; }
        
        .lightbox-img { 
            max-width: 90vw; max-height: 80vh; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
            object-fit: contain; transform: scale(0.9); transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); 
            user-select: none; -webkit-user-drag: none;
        }
        .lightbox-overlay.active .lightbox-img { transform: scale(1); }
        
        .lightbox-nav { 
            position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); 
            color: #fff; width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            font-size: 1.5rem; cursor: pointer; transition: all 0.3s; backdrop-filter: blur(10px); z-index: 10;
        }
        .lightbox-nav:hover { background: rgba(255,255,255,0.2); transform: translateY(-50%) scale(1.1); box-shadow: 0 0 20px rgba(255,255,255,0.2); }
        .lightbox-prev { left: 30px; }
        .lightbox-next { right: 30px; }
        
        .lightbox-close { 
            position: absolute; top: 30px; right: 40px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); 
            color: #fff; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            font-size: 1.5rem; cursor: pointer; transition: all 0.3s; z-index: 100; backdrop-filter: blur(10px);
        }
        .lightbox-close:hover { background: rgba(255,255,255,0.2); transform: rotate(90deg) scale(1.1); color: var(--c1); }
        
        .lightbox-caption { 
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); 
            padding: 12px 24px; border-radius: 100px; color: #fff; font-family: 'DM Sans', sans-serif; font-size: 1rem; 
            font-weight: 600; backdrop-filter: blur(10px); text-align: center; max-width: 80%; border: 1px solid rgba(255,255,255,0.1);
        }

        @media (max-width: 768px) {
            .lightbox-prev, .lightbox-next { display: none; /* Hide buttons on mobile, rely on swipe */ }
            .lightbox-img { max-width: 95vw; max-height: 70vh; }
            .lightbox-caption { bottom: 20px; font-size: 0.85rem; padding: 10px 16px; width: 90%; }
            .lightbox-close { top: 20px; right: 20px; width: 40px; height: 40px; }
        }
    </style>
</head>
