<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Cobe Globe</title>
  <style>
    /* Reset and base dark theme styling */
    body {
      margin: 0;
      background-color: #111111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden; /* Prevents scrollbars when dragging */
    }

    /* Container for the globe */
    .widget-container {
      width: 100%;
      max-width: 600px;
      aspect-ratio: 1;
      background-color: #111111;
    }

    /* Globe canvas */
    #cobe-canvas {
      width: 100%;
      height: 100%;
      contain: layout paint size;
      cursor: grab; /* Indicates draggability */
      touch-action: none; /* Prevents native mobile scrolling when interacting */
    }
    
    #cobe-canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <canvas id="cobe-canvas"></canvas>
  </div>

  <script type="module">
    import createGlobe from 'https://cdn.skypack.dev/cobe';

    const canvas = document.getElementById("cobe-canvas");
    
    // Rotation state variables
    let phi = 0;
    let isDragging = false;
    let startX = 0;
    let startPhi = 0;
    
    const globe = createGlobe(canvas, {
      devicePixelRatio: 2,
      width: 600 * 2,
      height: 600 * 2,
      phi: 0,
      theta: 0.1, 
      dark: 1, 
      diffuse: 1.2, 
      mapSamples: 16000,
      mapBrightness: 6,
      baseColor: [0.3, 0.3, 0.3], // Dark grey landmass
      markerColor: [1, 1, 1], // Pure white marker
      glowColor: [0, 0, 0], // Set to 0 to completely remove the outer glow
      markers: [
        // Dhaka, Bangladesh
        { location: [23.8103, 90.4125], size: 0.05 } 
      ]
    });

    // --- Drag Interaction Logic ---
    
    canvas.addEventListener('pointerdown', (e) => {
      isDragging = true;
      startX = e.clientX;
      startPhi = phi;
    });

    // We attach pointermove and pointerup to the window so the drag 
    // doesn't awkwardly drop if the user moves their mouse off the canvas fast
    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      
      const deltaX = e.clientX - startX;
      // Adjust the multiplier (0.005) to change drag sensitivity
      phi = startPhi + deltaX * 0.005; 
    });

    window.addEventListener('pointerup', () => {
      isDragging = false;
    });

    // --- Animation Loop ---
    function animate() {
      // Only auto-rotate if the user isn't currently dragging
      if (!isDragging) {
        phi += 0.0015; // Slow ambient spin
      }
      
      globe.update({ phi });
      requestAnimationFrame(animate);
    }
    
    animate();
  </script>

</body>
</html>
