<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cobe 3D Globe - Styled</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      background: #0e0e10; 
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      font-family: 'Bricolage Grotesque', sans-serif;
    }

    /* Container holding the globe and the clock */
    .globe-wrapper {
      position: relative;
      width: 700px;
      height: 700px;
    }

    /* The radial fade mask to blend the globe edges into the background */
    .globe-container {
      width: 100%;
      height: 100%;
      -webkit-mask-image: radial-gradient(circle at 50% 50%, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 65%);
      mask-image: radial-gradient(circle at 50% 50%, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 65%);
    }

    canvas {
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }

    /* Local Time Overlay Styling */
    .time-block {
      position: absolute;
      bottom: 60px;
      left: 40px;
      color: white;
      pointer-events: none;
    }

    .time-label {
      font-size: 14px;
      color: #757a82;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
      margin-bottom: -5px;
    }

    .time-value {
      font-size: 72px;
      font-weight: 700;
      display: flex;
      align-items: baseline;
      gap: 12px;
      letter-spacing: -0.02em;
    }

    #time-ampm {
      font-size: 24px;
    }
  </style>
</head>
<body>

  <div class="globe-wrapper">
    <!-- Globe -->
    <div class="globe-container">
      <canvas id="cobe"></canvas>
    </div>

    <!-- Clock Overlay -->
    <div class="time-block">
      <div class="time-label">Local Time</div>
      <div class="time-value">
        <span id="time-digits">12:58</span>
        <span id="time-ampm">AM</span>
      </div>
    </div>
  </div>

  <script type="module">
    import createGlobe from 'https://unpkg.com/cobe@0.6.3/dist/index.mjs';

    const canvas = document.getElementById("cobe");
    
    // Scale for high-DPI displays
    const size = 700;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr;
    canvas.height = size * dpr;

    let phi = 4.3; // Starts the rotation facing South Asia/Middle East

    const globe = createGlobe(canvas, {
      devicePixelRatio: dpr,
      width: size * dpr,
      height: size * dpr,
      phi: phi,
      theta: 0.2,
      dark: 1,
      diffuse: 0.55,
      mapSamples: 20000,
      mapBrightness: 12,
      baseColor: [0.11, 0.12, 0.12], // Dark slate to match the image background
      markerColor: [1, 1, 1],        // Pure white marker
      glowColor: [0, 0, 0],          // Removes the outer atmospheric glow
      markers: [
        { location: [23.8103, 90.4125], size: 0.07 }
      ]
    });

    // Rotation Loop
    function animateGlobe() {
      phi += 0.003;
      globe.update({ phi });
      requestAnimationFrame(animateGlobe);
    }
    animateGlobe();

    // Clock Logic
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12; 
      const minutes = now.getMinutes().toString().padStart(2, '0');
      
      document.getElementById('time-digits').textContent = `${hours}:${minutes}`;
      document.getElementById('time-ampm').textContent = ampm;
    }
    
    setInterval(updateClock, 1000);
    updateClock();
  </script>

</body>
</html>
