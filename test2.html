<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slow Rotating Globe</title>
  <style>
    /* Reset and base dark theme styling */
    body {
      margin: 0;
      background-color: #111111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Container for the globe */
    .widget-container {
      width: 100%;
      max-width: 600px;
      aspect-ratio: 1;
      background-color: #111111;
    }

    /* Globe canvas - perfectly centered, dragging disabled */
    #cobe-canvas {
      width: 100%;
      height: 100%;
      contain: layout paint size;
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <canvas id="cobe-canvas"></canvas>
  </div>

  <script type="module">
    import createGlobe from 'https://cdn.skypack.dev/cobe';

    const canvas = document.getElementById("cobe-canvas");
    
    // Starting phi offset to position Bangladesh on the curved left edge,
    // which forces the marker to skew along the 3D surface immediately.
    let phi = 2.4; 
    
    const globe = createGlobe(canvas, {
      devicePixelRatio: 2,
      width: 600 * 2, 
      height: 600 * 2,
      phi: 2.4, 
      theta: 0.1, 
      dark: 1, 
      diffuse: 1.2, 
      mapSamples: 16000,
      mapBrightness: 6,
      baseColor: [0.3, 0.3, 0.3], // Dark grey landmass
      markerColor: [1, 1, 1], // Pure white marker 
      glowColor: [0, 0, 0], // Keeps the outer glow completely removed
      markers: [
        // Dhaka, Bangladesh
        { location: [23.8103, 90.4125], size: 0.055 } 
      ]
    });

    // Simple animation loop for slow, automatic spinning
    function animate() {
      phi += 0.002; // Slow ambient spin
      globe.update({ phi });
      requestAnimationFrame(animate);
    }
    
    animate();
  </script>

</body>
</html>
