<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cobe 3D Globe</title>
  <style>
    body {
      background: #0e0e10;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    /* The CSS size is exactly half the HTML buffer size for a sharp Retina look */
    canvas {
      width: 500px;
      height: 500px;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>

  <!-- The internal buffer is strictly locked to 1000x1000 -->
  <canvas id="cobe" width="1000" height="1000"></canvas>

  <script type="module">
    // Using esm.sh instead of Skypack to ensure the map texture doesn't break
    import createGlobe from 'https://esm.sh/cobe';

    let phi = 0;
    const canvas = document.getElementById("cobe");

    createGlobe(canvas, {
      devicePixelRatio: 2,
      width: 1000,
      height: 1000,
      phi: 0,
      theta: 0.3,
      dark: 1,
      diffuse: 1.2,
      mapSamples: 16000,
      mapBrightness: 6,
      baseColor: [0.1, 0.1, 0.1],
      markerColor: [0.98, 0.38, 0.36],
      glowColor: [0.05, 0.05, 0.05],
      markers: [
        // Coral marker pinned to Dhaka
        { location: [23.8103, 90.4125], size: 0.08 }
      ],
      onRender: (state) => {
        state.phi = phi;
        phi += 0.005;
      }
    });
  </script>

</body>
</html>
