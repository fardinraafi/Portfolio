<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cobe 3D Globe - 3D Marker</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&display=swap" rel="stylesheet">
  <style>
    body {
      background: #0e0e10;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Bricolage Grotesque', Arial, sans-serif;
      overflow: hidden;
    }

    .globe-wrapper {
      position: relative;
      width: 500px;
      height: 500px;
    }

    .globe-container {
      width: 100%;
      height: 100%;
      -webkit-mask-image: radial-gradient(circle at 50% 50%, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 65%);
      mask-image: radial-gradient(circle at 50% 50%, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 65%);
    }

    canvas {
      width: 100%;
      height: 100%;
      cursor: grab;
      image-rendering: pixelated;
    }
    canvas:active {
      cursor: grabbing;
    }

    /* Clock Styling */
    .time-block {
      position: absolute;
      bottom: 20px;
      left: 0px;
      color: white;
      pointer-events: none;
      z-index: 10;
    }

    .time-label {
      font-size: 12px;
      color: #757a82;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .time-value {
      font-size: 54px;
      font-weight: 800;
      display: flex;
      align-items: baseline;
      gap: 8px;
      letter-spacing: -0.02em;
      margin: 0;
      line-height: 1;
    }

    #time-ampm {
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="globe-wrapper">
    <div class="globe-container">
      <canvas id="cobe" width="1000" height="1000"></canvas>
    </div>

    <!-- Clock Overlay -->
    <div class="time-block">
      <div class="time-label">Local Time</div>
      <div class="time-value">
        <span id="time-digits">12:00</span>
        <span id="time-ampm">AM</span>
      </div>
    </div>
  </div>

  <script type="module">
    import createGlobe from 'https://esm.sh/cobe';

    const canvas = document.getElementById("cobe");
    canvas.width = 1000;
    canvas.height = 1000;

    let phi = 4.0;

    const globe = createGlobe(canvas, {
      devicePixelRatio: 2,
      width: 1000,
      height: 1000,
      phi: phi,
      theta: 0.2,
      dark: 1,
      diffuse: 1.2,
      mapSamples: 16000,
      mapBrightness: 6,
      baseColor: [0.3, 0.3, 0.3],
      glowColor: [0, 0, 0],

      // White marker, drawn by WebGL on the globe surface
      markerColor: [1, 1, 1],
      markers: [
        { location: [23.8103, 90.4125], size: 0.06 }
      ]
    });

    function animate() {
      phi += 0.003;
      globe.update({ phi });
      requestAnimationFrame(animate);
    }
    animate();

    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      const minutes = now.getMinutes().toString().padStart(2, '0');

      document.getElementById('time-digits').textContent = `${hours}:${minutes}`;
      document.getElementById('time-ampm').textContent = ampm;
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>

</body>
</html>
