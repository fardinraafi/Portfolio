<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cobe 3D Globe - Draggable</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&display=swap" rel="stylesheet">
  <style>
    body {
      background: #0e0e10;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Bricolage Grotesque', Arial, sans-serif;
      overflow: hidden;
    }

    .globe-wrapper {
      position: relative;
      width: 500px;
      height: 500px;
    }

    .globe-container {
      width: 100%;
      height: 100%;
      -webkit-mask-image: radial-gradient(circle at 50% 50%, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 65%);
      mask-image: radial-gradient(circle at 50% 50%, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 65%);
    }

    canvas {
      width: 100%;
      height: 100%;
      cursor: grab;
      image-rendering: pixelated;
      /* Stops the page from scrolling while dragging on touch screens */
      touch-action: none;
    }
    canvas:active {
      cursor: grabbing;
    }

    /* Clock Styling */
    .time-block {
      position: absolute;
      bottom: 20px;
      left: 0px;
      color: white;
      pointer-events: none;
      z-index: 10;
    }

    .time-label {
      font-size: 12px;
      color: #757a82;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .time-value {
      font-size: 54px;
      font-weight: 800;
      display: flex;
      align-items: baseline;
      gap: 8px;
      letter-spacing: -0.02em;
      margin: 0;
      line-height: 1;
    }

    #time-ampm {
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="globe-wrapper">
    <div class="globe-container">
      <canvas id="cobe" width="1000" height="1000"></canvas>
    </div>

    <!-- Clock Overlay -->
    <div class="time-block">
      <div class="time-label">Local Time</div>
      <div class="time-value">
        <span id="time-digits">12:00</span>
        <span id="time-ampm">AM</span>
      </div>
    </div>
  </div>

  <script type="module">
    import createGlobe from 'https://esm.sh/cobe';

    const canvas = document.getElementById("cobe");
    canvas.width = 1000;
    canvas.height = 1000;

    const AUTO_SPEED = 0.003;     // auto-rotation speed
    const DRAG_SENSITIVITY = 200; // higher = slower drag
    const DEFAULT_THETA = 0.2;    // resting tilt

    let phi = 4.0;
    let theta = DEFAULT_THETA;

    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    const globe = createGlobe(canvas, {
      devicePixelRatio: 2,
      width: 1000,
      height: 1000,
      phi: phi,
      theta: theta,
      dark: 1,
      diffuse: 1.2,
      mapSamples: 16000,
      mapBrightness: 6,
      baseColor: [0.3, 0.3, 0.3],
      glowColor: [0, 0, 0],

      markerColor: [1, 1, 1],
      markers: [
        { location: [23.8103, 90.4125], size: 0.06 }
      ]
    });

    // Drag controls (works with mouse, touch and pen)
    canvas.addEventListener('pointerdown', (e) => {
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;

      phi += dx / DRAG_SENSITIVITY;
      theta += dy / DRAG_SENSITIVITY;
      // Keep the tilt in a sensible range so the globe never flips over
      theta = Math.max(-0.8, Math.min(0.8, theta));
    });

    const stopDragging = (e) => {
      dragging = false;
      if (canvas.hasPointerCapture(e.pointerId)) {
        canvas.releasePointerCapture(e.pointerId);
      }
    };
    canvas.addEventListener('pointerup', stopDragging);
    canvas.addEventListener('pointercancel', stopDragging);

    function animate() {
      if (!dragging) {
        phi += AUTO_SPEED;
        // Ease the tilt back to its resting angle after a drag
        theta += (DEFAULT_THETA - theta) * 0.03;
      }
      globe.update({ phi, theta });
      requestAnimationFrame(animate);
    }
    animate();

    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      const minutes = now.getMinutes().toString().padStart(2, '0');

      document.getElementById('time-digits').textContent = `${hours}:${minutes}`;
      document.getElementById('time-ampm').textContent = ampm;
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>

</body>
</html>
