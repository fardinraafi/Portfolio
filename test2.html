<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cobe 3D Globe</title>
  <style>
    body {
      background: #0e0e10; 
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    
    .globe-container {
      width: 500px;
      height: 500px;
    }
    
    canvas {
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    
    canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>

  <div class="globe-container">
    <canvas id="cobe" width="1000" height="1000"></canvas>
  </div>

  <script type="module">
    // Pulling the raw ES module from unpkg so the continent texture isn't corrupted
    import createGlobe from 'https://unpkg.com/cobe@0.6.3/dist/index.mjs';

    let phi = 0;
    const canvas = document.getElementById("cobe");

    const globe = createGlobe(canvas, {
      devicePixelRatio: 2,
      width: 1000,
      height: 1000,
      phi: 0,
      theta: 0.3,
      dark: 1,                      // 1 = Dark mode (activates the white dots)
      diffuse: 1.2,
      mapSamples: 16000,
      mapBrightness: 6,
      baseColor: [0.1, 0.1, 0.1],   // Globe surface color
      markerColor: [0.98, 0.38, 0.36], // Coral location pin
      glowColor: [0.05, 0.05, 0.05], // Subtle atmospheric glow
      markers: [
        { location: [23.8103, 90.4125], size: 0.08 }
      ],
      onRender: (state) => {
        state.phi = phi;
        phi += 0.003; 
      }
    });
  </script>

</body>
</html>
