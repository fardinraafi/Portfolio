<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Globe Widget</title>
  <style>
    /* Reset and base dark theme styling */
    body {
      margin: 0;
      background-color: #111111;
      color: white;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Container for the globe and the text overlay */
    .widget-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      aspect-ratio: 1;
      overflow: hidden;
      background-color: #111111;
    }

    /* Globe canvas - scaled up slightly and positioned to match the screenshot */
    #cobe-canvas {
      width: 120%;
      height: 120%;
      position: absolute;
      top: -10%;
      left: 10%; /* Pushes the globe slightly right */
      contain: layout paint size;
    }

    /* Time overlay positioning */
    .time-overlay {
      position: absolute;
      bottom: 40px;
      left: 40px;
      z-index: 10;
      display: flex;
      flex-direction: column;
    }

    .time-label {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #666666;
      margin-bottom: 4px;
    }

    .time-display {
      display: flex;
      align-items:baseline;
      gap: 8px;
    }

    .time-time {
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1;
    }

    .time-ampm {
      font-size: 1.25rem;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <!-- Globe -->
    <canvas id="cobe-canvas"></canvas>
    
    <!-- Text Overlay -->
    <div class="time-overlay">
      <div class="time-label">LOCAL TIME</div>
      <div class="time-display">
        <span class="time-time" id="clock-time">--:--</span>
        <span class="time-ampm" id="clock-ampm"></span>
      </div>
    </div>
  </div>

  <script type="module">
    import createGlobe from 'https://cdn.skypack.dev/cobe';

    // 1. GLOBE SETUP
    let phi = 0;
    const canvas = document.getElementById("cobe-canvas");
    
    const globe = createGlobe(canvas, {
      devicePixelRatio: 2,
      width: 720 * 2, // Doubled for high-res retina displays
      height: 720 * 2,
      phi: 0,
      theta: 0.3, // Tilts the globe on an angle like your screenshot
      dark: 1, // Dark mode on
      diffuse: 1.2,
      mapSamples: 16000,
      mapBrightness: 6,
      baseColor: [0.3, 0.3, 0.3], // Grey dots for the landmass
      markerColor: [1, 1, 1], // Pure white marker
      glowColor: [0.05, 0.05, 0.05], // Very subtle glow to blend with background
      markers: [
        // Latitude and Longitude for Dhaka, Bangladesh
        { location: [23.8103, 90.4125], size: 0.06 } 
      ]
    });

    // Animate the globe spinning slowly
    function animate() {
      phi += 0.0025; // Lower number = slower spin
      globe.update({ phi });
      requestAnimationFrame(animate);
    }
    animate();

    // 2. CLOCK SETUP
    function updateClock() {
      // Set to force Dhaka timezone, regardless of where the user is viewing from
      const now = new Date();
      const options = { timeZone: 'Asia/Dhaka', hour12: true, hour: '2-digit', minute: '2-digit' };
      const timeString = now.toLocaleTimeString('en-US', options); // e.g., "02:27 PM"
      
      const [time, ampm] = timeString.split(' ');
      
      document.getElementById('clock-time').textContent = time;
      document.getElementById('clock-ampm').textContent = ampm;
    }

    // Update clock immediately, then every second
    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
