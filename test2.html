<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COBE 3D Globe - Fixed</title>
  <style>
    body {
      background: #0e0e10; 
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .globe-container {
      width: 500px;
      height: 500px;
    }
    canvas {
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>

  <div class="globe-container">
    <canvas id="cobe"></canvas>
  </div>

  <script type="module">
    import createGlobe from 'https://cdn.skypack.dev/cobe';

    const canvas = document.getElementById("cobe");
    
    // Set exact CSS dimensions
    const width = 500;
    const height = 500;
    
    // Calculate pixel ratio for retina displays
    const dpr = window.devicePixelRatio || 1;
    
    // Canvas physical size MUST be scaled by the devicePixelRatio to render dots correctly
    canvas.width = width * dpr;
    canvas.height = height * dpr;

    // Create the globe
    const globe = createGlobe(canvas, {
      devicePixelRatio: dpr,
      width: width * dpr,    // Use width * dpr for retina
      height: height * dpr,  // Use height * dpr for retina[cite: 13]
      phi: 0,                // Horizontal rotation[cite: 13]
      theta: 0.3,            // Vertical tilt[cite: 13]
      dark: 1,               // 1 = dark mode[cite: 13]
      diffuse: 1.2,          // Lighting intensity[cite: 13]
      mapSamples: 16000,     // Number of dots rendering the map[cite: 13]
      mapBrightness: 6,      // Brightness of land dots[cite: 13]
      baseColor: [1, 1, 1],  // [1, 1, 1] = white[cite: 13]
      markerColor: [0.98, 0.38, 0.36], // Coral location pin
      glowColor: [0.1, 0.1, 0.1], // Atmospheric glow around the globe[cite: 13]
      markers: [
        // Location set to Dhaka (Lat, Lon)
        { location: [23.8103, 90.4125], size: 0.08 }
      ]
    });

    // Animate the globe using the v2 API[cite: 13]
    let phi = 0;
    function animate() {
      phi += 0.005; // Adjust speed as needed[cite: 13]
      globe.update({ phi }); // Updates globe state and triggers a re-render[cite: 13]
      requestAnimationFrame(animate);
    }
    
    // Start the animation loop
    animate();
  </script>

</body>
</html>
