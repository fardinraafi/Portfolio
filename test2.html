<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centered Globe</title>
  <style>
    /* Reset and base dark theme styling */
    body {
      margin: 0;
      background-color: #111111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Container for the globe */
    .widget-container {
      width: 100%;
      max-width: 600px;
      aspect-ratio: 1;
      background-color: #111111;
    }

    /* Globe canvas - perfectly centered */
    #cobe-canvas {
      width: 100%;
      height: 100%;
      contain: layout paint size;
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <canvas id="cobe-canvas"></canvas>
  </div>

  <script type="module">
    import createGlobe from 'https://cdn.skypack.dev/cobe';

    let phi = 0;
    const canvas = document.getElementById("cobe-canvas");
    
    const globe = createGlobe(canvas, {
      devicePixelRatio: 2,
      width: 600 * 2, // Matches max-width * 2 for retina displays
      height: 600 * 2,
      phi: 0,
      theta: 0.1, // Reduced the tilt so you can see the full globe better
      dark: 1, 
      diffuse: 1.5, // Softened the lighting on the globe
      mapSamples: 16000,
      mapBrightness: 6,
      baseColor: [0.25, 0.25, 0.25], // Slightly darker grey landmass
      markerColor: [0.1, 0.9, 1], // Neon cyan color to give a "glowing" illusion
      glowColor: [0.05, 0.1, 0.15], // Subtle blueish atmospheric glow
      markers: [
        // Dhaka, Bangladesh
        { location: [23.8103, 90.4125], size: 0.07 } 
      ]
    });

    // Animate the globe spinning slowly
    function animate() {
      phi += 0.0025; 
      globe.update({ phi });
      requestAnimationFrame(animate);
    }
    animate();
  </script>

</body>
</html>
