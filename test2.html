<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotating 3D Globe</title>
  <style>
    /* Matches the dark background of the website */
    body {
      background: #0e0e10; 
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .globe-container {
      width: 500px;
      height: 500px;
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
      contain: layout paint size;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>

  <div class="globe-container">
    <canvas id="cobe"></canvas>
  </div>

  <script type="module">
    // Load the Cobe 3D globe library directly from the web
    import createGlobe from 'https://cdn.skypack.dev/cobe';

    let phi = 0;
    const canvas = document.getElementById("cobe");
    
    // Scale the canvas for high-DPI (Retina) displays so dots are crisp
    const size = 500;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr;
    canvas.height = size * dpr;

    const globe = createGlobe(canvas, {
      devicePixelRatio: dpr,
      width: size * dpr,
      height: size * dpr,
      phi: 0,
      theta: 0.3,
      dark: 1,                      // 1 = Dark mode (white dots)
      diffuse: 1.2,                 // Light diffusion
      mapSamples: 16000,            // The amount of dots 
      mapBrightness: 12,            // How bright the white dots glow
      baseColor: [0.15, 0.15, 0.15], // Dark grey sphere (lets white dots show)
      markerColor: [0.98, 0.38, 0.36], // Coral location pin
      glowColor: [1, 1, 1],         // White atmospheric edge glow
      markers: [
        // Location marker (Lat, Long). Currently set to Dhaka.
        { location: [23.8103, 90.4125], size: 0.08 }
      ],
      onRender: (state) => {
        // Rotates the globe on every frame
        state.phi = phi;
        phi += 0.003; 
        
        // Cobe requires width/height to be updated on every frame to render dots
        state.width = size * dpr;
        state.height = size * dpr;
      }
    });
  </script>

</body>
</html>
