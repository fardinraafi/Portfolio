# Pings Bing/Yandex (IndexNow) with every page in the sitemap after each push, so ChatGPT search (Bing) picks up changes fast.
name: IndexNow
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'scripts/**', '.github/**']
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deploy
        run: sleep 120
      - name: Submit sitemap URLs
        run: |
          URLS=$(curl -s https://fardinraafi.com/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s .)
          echo "$URLS" | jq length
          curl -s -o /dev/null -w "IndexNow status: %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"fardinraafi.com\",\"key\":\"7a0756fd03d4d7c7cc6086db4eff5f32\",\"keyLocation\":\"https://fardinraafi.com/7a0756fd03d4d7c7cc6086db4eff5f32.txt\",\"urlList\":$URLS}"
