<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog - Fardin Rahman Khan Raafi</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Keeping your exact theme variables and styles */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --c1: #2563EB; --c2: #7C3AED; --c3: #DB2777; --text-main: #0F172A; --text-muted: #475569; --bg-page: #F8FAFC; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg-page); color: var(--text-main); overflow-x: hidden; line-height: 1.6; }
.bg-mesh { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: #F1F5F9; }
.blob { position: absolute; filter: blur(90px); opacity: 0.6; border-radius: 50%; animation: float 20s infinite alternate ease-in-out; }
.blob-1 { width: 50vw; height: 50vw; background: rgba(37,99,235,0.3); top: -10%; left: -10%; }
.blob-2 { width: 40vw; height: 40vw; background: rgba(124,58,237,0.3); bottom: -10%; right: -5%; animation-delay: -5s; }
@keyframes float { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(5%, 10%) scale(1.1); } 100% { transform: translate(-5%, -5%) scale(0.9); } }

/* Centered Reading Layout */
.layout-wrapper { max-width: 800px; margin: 0 auto; padding: 4rem 2rem; display: flex; flex-direction: column; gap: 2rem; }
.glass-card { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 24px; padding: 2rem; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04); }
h1 { font-family: 'Syne', sans-serif; font-size: 2.5rem; font-weight: 800; line-height: 1.1; margin-bottom: 1rem; }
.gradient-text { background: linear-gradient(135deg, var(--c1), var(--c2), var(--c3)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.btn-outline { display: inline-block; padding: 8px 16px; border-radius: 100px; text-decoration: none; font-weight: 600; font-size: 0.9rem; background: rgba(255,255,255,0.8); color: var(--text-main); border: 1px solid #64748B; margin-bottom: 2rem; transition: all 0.3s ease; }
.btn-outline:hover { border-color: var(--c1); color: var(--c1); }

/* Blog Post Cards */
.blog-card { display: block; padding: 1.5rem; background: rgba(255,255,255,0.6); border: 1px solid rgba(37,99,235,0.2); border-radius: 16px; text-decoration: none; color: var(--text-main); transition: all 0.3s ease; }
.blog-card:hover { background: #FFF; border-color: var(--c1); transform: translateY(-3px); box-shadow: 0 10px 25px rgba(37,99,235,0.1); }
.blog-date { font-size: 0.85rem; color: var(--c1); font-weight: 600; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; }
.blog-title { font-family: 'Syne', sans-serif; font-size: 1.4rem; margin-bottom: 0.5rem; }
</style>
</head>
<body>
<div class="bg-mesh"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>

<div class="layout-wrapper">
  <a href="/index.html" class="btn-outline">← Back to Portfolio</a>
  
  <header style="text-align: center; margin-bottom: 2rem;">
    <h1 class="gradient-text">My Thoughts & Insights</h1>
    <p style="color: var(--text-muted); font-size: 1.1rem;">Writing about B2B growth, marketing strategies, and personal development.</p>
  </header>

  <!-- BLOG POST 1 CARD -->
  <a href="/first-blog.html" class="blog-card">
    <div class="blog-date">June 2026</div>
    <h2 class="blog-title">The Future of B2B Lead Generation</h2>
    <p style="color: var(--text-muted); font-size: 0.95rem;">How AI and personalized outreach are entirely changing the landscape of growth operations and scaling businesses.</p>
  </a>

  <!-- You can copy and paste the card above to add more blogs later! -->

</div>
</body>
</html>
